- id: model
  name: './model.ts'
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  config:
    watch: false
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask
- id: agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: mock-obis-proposal
    model: event-reader
    workspaceContext: false
    includeHarnessIdentity: false
    persona: 'Propose the requested enterprise action.'
    persistenceCompression: none
- id: obis
  name: '@deepseek-ai/dsh-tool-obis'
  config:
    baseUrl: !!js process.env.OBIS_RUNTIME_BASE_URL
    environmentId: test
    credentialRef: OBIS_DELEGATED_ACCESS_TOKEN
    autonomy: read-only
    referenceAutonomy: human-approved
    eventReadTimeoutMs: 5000
