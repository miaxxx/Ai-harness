name: Enterprise Lint Autofix

on:
  push:
    branches: ['feature/enterprise-v3.1-sprint-a']

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message != 'style: autofix enterprise lint'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build host contracts
        run: pnpm run build:lib:host
      - name: Autofix only enterprise validation offenders
        shell: bash
        run: |
          pnpm exec tsx scripts/run-oxlint.ts \
            apps/desktop/src/desktop-obis-identity-main.ts \
            apps/desktop/src/desktop-obis-identity-ui.ts \
            apps/desktop/src/desktop-enterprise-overview-main.ts \
            apps/desktop/src/desktop-enterprise-overview-ui.ts \
            apps/desktop/src/desktop-enterprise-shell.ts \
            apps/desktop/src/desktop-enterprise-scope-main.ts \
            apps/desktop/src/main.ts \
            packages/obis/bridge/src/client.ts \
            packages/obis/launch/src/client/index.ts \
            packages/obis/tool-obis/src/index.ts \
            --fix || true
      - name: Commit autofix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/desktop/src/desktop-obis-identity-main.ts \
            apps/desktop/src/desktop-obis-identity-ui.ts \
            apps/desktop/src/desktop-enterprise-overview-main.ts \
            apps/desktop/src/desktop-enterprise-overview-ui.ts \
            apps/desktop/src/desktop-enterprise-shell.ts \
            apps/desktop/src/desktop-enterprise-scope-main.ts \
            apps/desktop/src/main.ts \
            packages/obis/bridge/src/client.ts \
            packages/obis/launch/src/client/index.ts \
            packages/obis/tool-obis/src/index.ts
          if git diff --cached --quiet; then
            echo 'No autofixable enterprise lint changes.'
            exit 0
          fi
          git commit -m 'style: autofix enterprise lint'
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
