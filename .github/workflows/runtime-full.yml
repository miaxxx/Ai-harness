name: Standalone runtime

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test persistent ACP runtime
        run: pnpm exec vitest run packages/acp/acp/tests tests/runtime-portability.e2e.ts
      # Keep correctness and packaging as separate gates. The host project graph
      # is the authoritative TypeScript boundary. The Phase-B acceptance only
      # needs two release-shaped binaries, so do not make it depend on unrelated
      # workspace packaging (for example packages/api/sdk declaration bundling).
      - name: Typecheck host project graph
        run: pnpm exec tsc -b tsconfig.host.json --pretty false
      - name: Build CLI acceptance binary
        run: pnpm --dir apps/cli exec tsdown
      - name: Build ACP Runtime acceptance binary
        run: pnpm --dir packages/examples/acp-demo exec tsdown
      - name: Test CLI to persistent ACP Runtime binaries
        run: pnpm exec vitest run apps/cli/tests/acp-binary.spec.ts
      - name: Verify client/runtime boundary
        run: pnpm exec tsx scripts/verify-client-runtime-boundary.ts
      - name: Verify tool side-effect boundary
        run: pnpm exec tsx scripts/verify-side-effect-boundaries.ts
