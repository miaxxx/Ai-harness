name: Standalone runtime

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/acp/acp/tests tests/runtime-portability.e2e.ts
      - run: pnpm exec tsc -p packages/acp/acp/tsconfig.json --noEmit
      - run: pnpm exec tsx scripts/verify-client-runtime-boundary.ts
      - run: pnpm exec tsx scripts/verify-side-effect-boundaries.ts
