name: Standalone runtime

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test persistent ACP runtime
        run: pnpm exec vitest run packages/acp/acp/tests tests/runtime-portability.e2e.ts
      # The product-boundary acceptance below executes published lib/bin.js
      # entrypoints, so use the repository's canonical host build rather than a
      # typecheck-only tsc invocation. This still validates the authoritative
      # TypeScript project-reference graph and additionally materializes the
      # release-shaped CLI and ACP Runtime artifacts with tsdown.
      - name: Build and typecheck host project graph
        run: pnpm run build:lib:host
      - name: Test CLI to persistent ACP Runtime binaries
        run: pnpm exec vitest run apps/cli/tests/acp-binary.e2e.ts
      - name: Verify client/runtime boundary
        run: pnpm exec tsx scripts/verify-client-runtime-boundary.ts
      - name: Verify tool side-effect boundary
        run: pnpm exec tsx scripts/verify-side-effect-boundaries.ts
