name: Standalone runtime

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Test persistent ACP runtime
        run: pnpm exec vitest run packages/acp/acp/tests tests/runtime-portability.e2e.ts
      # Binary acceptance must exercise release-shaped runtime modules rather
      # than source imports. `build:lib:host` is the repository-owned host
      # dependency graph: it typechecks project references and emits the JS
      # package closure that the ACP Runtime bin resolves under plain Node.
      # The CLI remains an app-level artifact, so it is built separately below.
      - name: Build host runtime closure
        run: pnpm run build:lib:host
      - name: Build CLI acceptance binary
        run: pnpm --dir apps/cli exec tsdown
      - name: Test CLI to persistent ACP Runtime binaries
        run: pnpm exec vitest run apps/cli/tests/acp-binary.spec.ts
      - name: Verify client/runtime boundary
        run: pnpm exec tsx scripts/verify-client-runtime-boundary.ts
      - name: Verify tool side-effect boundary
        run: pnpm exec tsx scripts/verify-side-effect-boundaries.ts
