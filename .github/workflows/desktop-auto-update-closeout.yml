name: Desktop auto update closeout

on:
  push:
    branches: [feature/enterprise-v3.1-sprint-a]
    paths:
      - .github/workflows/desktop-auto-update-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - name: Refresh lockfile for updater dependency
        run: pnpm install --no-frozen-lockfile
      - name: Validate updater code complete
        id: validate
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm run build:lib > .ci/desktop-auto-update.log 2>&1
          a=$?
          if [ "$a" -eq 0 ]; then pnpm --dir apps/desktop run build >> .ci/desktop-auto-update.log 2>&1; fi
          b=$?
          if [ "$a" -eq 0 ] && [ "$b" -eq 0 ]; then pnpm exec vitest run apps/desktop/tests/update.spec.ts apps/desktop/tests/enterprise-runtime-scope.spec.ts apps/desktop/tests/content.spec.ts >> .ci/desktop-auto-update.log 2>&1; fi
          c=$?
          cat .ci/desktop-auto-update.log
          if [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ]; then echo 'code=0' >> "$GITHUB_OUTPUT"; else echo 'code=1' >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Commit lockfile and validation result
        shell: bash
        run: |
          if [ '${{ steps.validate.outputs.code }}' = '0' ]; then
            rm -f .ci/desktop-auto-update.log .github/workflows/desktop-auto-update-closeout.yml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat(desktop): close auto update release runtime" || exit 0
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
      - name: Fail after preserving diagnostics
        if: ${{ steps.validate.outputs.code != '0' }}
        run: exit 1
