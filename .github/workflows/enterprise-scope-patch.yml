name: Enterprise Runtime Scope Integration Patch

on:
  push:
    branches:
      - feature/enterprise-v3.1-sprint-a
    paths:
      - .github/workflows/enterprise-scope-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - name: Patch Desktop runtime authority integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('apps/desktop/src/main.ts')
          text = main.read_text()
          old_env = """  const enterpriseEnv: Record<string, string> = scope === undefined ? {} : {\n    OBIS_DESKTOP_TENANT_ID: scope.tenantId,\n    ...(scope.projectId ? { OBIS_DESKTOP_PROJECT_ID: scope.projectId } : {}),\n    ...(scope.environmentId ? { OBIS_DESKTOP_ENVIRONMENT_ID: scope.environmentId } : {}),\n  }"""
          new_env = """  const enterpriseEnv: Record<string, string> = scope === undefined ? {} : {\n    OBIS_TENANT_ID: scope.tenantId,\n    OBIS_PROJECT_ID: scope.projectId,\n    OBIS_ENVIRONMENT_ID: scope.environmentId,\n    OBIS_INSTALLATION_ID: scope.installationId,\n  }"""
          if old_env not in text:
              raise SystemExit('main.ts enterprise env block did not match expected source')
          text = text.replace(old_env, new_env, 1)

          start_marker = "  async start(): Promise<void> { if (this.connection !== undefined) return;"
          guarded_start = """  async start(): Promise<void> {\n    if (process.env.OBIS_DESKTOP_REQUIRED?.trim() === '1' && enterpriseRuntimeScope() === undefined) {\n      this.publishStatus('stopped', 'Waiting for a validated enterprise runtime scope')\n      throw new Error('A validated enterprise runtime scope is required before ACP Runtime can start')\n    }\n    if (this.connection !== undefined) return;"""
          if start_marker not in text:
              raise SystemExit('main.ts ACP start marker did not match expected source')
          text = text.replace(start_marker, guarded_start, 1)
          main.write_text(text)

          shell = Path('apps/desktop/src/desktop-enterprise-shell.ts')
          text = shell.read_text()
          old_scope = """  const currentScope = (): { environmentId?: string; projectId?: string } => {\n    const environmentId = workspace.preferences.defaultEnvironmentId\n      ?? tenant.environments.find(item => item.kind === 'development')?.id\n      ?? tenant.environments[0]?.id\n    return {\n      ...(environmentId ? { environmentId } : {}),\n      ...(workspace.preferences.defaultProjectId ? { projectId: workspace.preferences.defaultProjectId } : {}),\n    }\n  }"""
          new_scope = """  const currentScope = (): { environmentId?: string; projectId?: string } => {\n    const projectId = workspace.preferences.defaultProjectId ?? tenant.projects[0]?.id\n    const environmentId = workspace.preferences.defaultEnvironmentId\n      ?? tenant.environments.find(item => item.kind === 'production' && item.status === 'active')?.id\n      ?? tenant.environments.find(item => item.status === 'active')?.id\n    return {\n      ...(projectId ? { projectId } : {}),\n      ...(environmentId ? { environmentId } : {}),\n    }\n  }\n\n  const requiredScope = (): { projectId: string; environmentId: string } => {\n    const scope = currentScope()\n    if (!scope.projectId || !scope.environmentId) {\n      throw new Error('Enterprise Desktop requires an OBIS project and active environment before AI Runtime can start.')\n    }\n    return { projectId: scope.projectId, environmentId: scope.environmentId }\n  }\n\n  const establishRuntimeScope = async (scope = requiredScope()): Promise<void> => {\n    await window.dshEnterprise.validateRuntimeScope(scope)\n    await window.dshDesktop.restartRuntime()\n  }"""
          if old_scope not in text:
              raise SystemExit('enterprise shell currentScope block did not match expected source')
          text = text.replace(old_scope, new_scope, 1)

          old_project = """    const project = el('select', 'enterprise-scope-select')\n    const projectEmpty = el('option')"""
          new_project = """    const scope = currentScope()\n    const project = el('select', 'enterprise-scope-select')\n    const projectEmpty = el('option')"""
          if old_project not in text:
              raise SystemExit('enterprise shell project selector marker did not match expected source')
          text = text.replace(old_project, new_project, 1)
          text = text.replace(
              "option.selected = value.id === workspace.preferences.defaultProjectId",
              "option.selected = value.id === scope.projectId",
              1,
          )
          text = text.replace(
              "    const environment = el('select', 'enterprise-scope-select')\n    const scope = currentScope()",
              "    const environment = el('select', 'enterprise-scope-select')",
              1,
          )

          old_save = """    const saveScope = async (): Promise<void> => {\n      workspace.preferences = await window.dshEnterprise.savePreferences({\n        pinnedIds: workspace.preferences.pinnedIds,\n        hiddenOptionalIds: workspace.preferences.hiddenOptionalIds,\n        navigationOrder: workspace.preferences.navigationOrder,\n        ...(project.value ? { defaultProjectId: project.value } : {}),\n        ...(environment.value ? { defaultEnvironmentId: environment.value } : {}),\n      })\n      window.dispatchEvent(new CustomEvent('dsh-enterprise-scope-change', {\n        detail: {\n          tenantId: tenant.id,\n          projectId: project.value || undefined,\n          environmentId: environment.value || undefined,\n        },\n      }))\n      if (currentItem?.kind === 'operations') await showRoute(currentItem)\n      renderRail()\n    }\n    project.onchange = () => { void saveScope() }\n    environment.onchange = () => { void saveScope() }"""
          new_save = """    const saveScope = async (): Promise<void> => {\n      if (!project.value || !environment.value) {\n        throw new Error('Project and environment are required for Enterprise Runtime scope.')\n      }\n      project.disabled = true\n      environment.disabled = true\n      try {\n        const nextScope = { projectId: project.value, environmentId: environment.value }\n        await window.dshEnterprise.validateRuntimeScope(nextScope)\n        workspace.preferences = await window.dshEnterprise.savePreferences({\n          pinnedIds: workspace.preferences.pinnedIds,\n          hiddenOptionalIds: workspace.preferences.hiddenOptionalIds,\n          navigationOrder: workspace.preferences.navigationOrder,\n          defaultProjectId: nextScope.projectId,\n          defaultEnvironmentId: nextScope.environmentId,\n        })\n        await window.dshDesktop.restartRuntime()\n        if (currentItem?.kind === 'operations') await showRoute(currentItem)\n        renderRail()\n      } finally {\n        project.disabled = false\n        environment.disabled = false\n      }\n    }\n    const saveScopeSafely = (): void => {\n      void saveScope().catch(error => {\n        console.error('[enterprise-scope] failed to switch runtime scope:', error)\n        renderScope()\n      })\n    }\n    project.onchange = saveScopeSafely\n    environment.onchange = saveScopeSafely"""
          if old_save not in text:
              raise SystemExit('enterprise shell saveScope block did not match expected source')
          text = text.replace(old_save, new_save, 1)

          if "  renderAll()\n  return () => {" not in text:
              raise SystemExit('enterprise shell initial render marker did not match expected source')
          text = text.replace(
              "  renderAll()\n  return () => {",
              "  await establishRuntimeScope()\n  renderAll()\n  return () => {",
              1,
          )
          shell.write_text(text)
          PY
      - name: Commit runtime scope integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime scope integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/main.ts apps/desktop/src/desktop-enterprise-shell.ts
          git commit -m 'feat(desktop): close enterprise runtime scope authority loop'
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
