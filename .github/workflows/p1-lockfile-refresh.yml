name: P1 lockfile refresh

on:
  push:
    branches:
      - feature/obis-enterprise-p1
    paths:
      - .github/workflows/p1-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - name: Regenerate only the pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(p1): refresh pnpm lockfile"
          git push origin HEAD:feature/obis-enterprise-p1
