name: Enterprise Semantic Lint Fix

on:
  push:
    branches: [feature/enterprise-v3.1-sprint-a]
    paths: [.github/workflows/enterprise-semantic-lint-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - name: Apply semantic fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected source not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('apps/desktop/src/desktop-enterprise-runtime-shared.ts').write_text("""export interface DesktopEnterpriseScopeRequest {
            projectId: string
            environmentId: string
          }

          export interface DesktopEnterpriseRuntimeScope {
            tenantId: string
            projectId: string
            environmentId: string
            installationId: string
            userId: string
          }
          """.replace('          ', ''))

          shared = Path('apps/desktop/src/desktop-obis-identity-shared.ts')
          text = shared.read_text()
          if not text.startswith("import type { DesktopEnterpriseRuntimeScope"):
              text = """import type {
            DesktopEnterpriseRuntimeScope,
            DesktopEnterpriseScopeRequest,
          } from './desktop-enterprise-runtime-shared.ts'

          """.replace('          ', '') + text
          old = "  updateDirectoryUser(input: DesktopDirectoryUserUpdateInput): Promise<DesktopDirectoryUser>\n}"
          new = """  updateDirectoryUser(input: DesktopDirectoryUserUpdateInput): Promise<DesktopDirectoryUser>
            validateRuntimeScope(input: DesktopEnterpriseScopeRequest): Promise<DesktopEnterpriseRuntimeScope>
          }""".replace('          ', '')
          if old not in text:
              raise SystemExit('bridge interface marker missing')
          shared.write_text(text.replace(old, new, 1))

          replace(
              'apps/desktop/src/desktop-obis-identity-preload.ts',
              "import './desktop-enterprise-runtime-shared.ts'\n",
              '',
          )

          replace(
              'apps/desktop/src/desktop-enterprise-scope-main.ts',
              """  process.env.OBIS_INSTALLATION_ID = activeScope.installationId

            // Keep the previous names only inside the Electron Main process while downstream
            // packages migrate. The ACP environment is populated from the validated scope.
            process.env.OBIS_DESKTOP_TENANT_ID = activeScope.tenantId
            process.env.OBIS_DESKTOP_PROJECT_ID = activeScope.projectId
            process.env.OBIS_DESKTOP_ENVIRONMENT_ID = activeScope.environmentId
          """.replace('          ', ''),
              "  process.env.OBIS_INSTALLATION_ID = activeScope.installationId\n",
          )

          replace(
              'packages/obis/tool-obis/src/index.ts',
              """    const binding = await ensureBinding(exec.agent)
              return {
                binding,
                context: {
                  environmentId: config.environmentId,
                  runId: binding.id,
                  ...(config.capabilityLease || binding.capabilityLease?.id ? { capabilityLease: config.capabilityLease ?? binding.capabilityLease!.id } : {}),
          """.replace('          ', ''),
              """    const binding = await ensureBinding(exec.agent)
              const capabilityLease = config.capabilityLease ?? binding.capabilityLease?.id
              return {
                binding,
                context: {
                  environmentId: config.environmentId,
                  runId: binding.id,
                  ...(capabilityLease ? { capabilityLease } : {}),
          """.replace('          ', ''),
          )

          replace(
              'apps/desktop/src/desktop-obis-identity-main.ts',
              """    const sameAuthority = existing?.baseURL === baseURL && existing.tenantId === tenantId
              const next: StoredObisIdentity = sameAuthority && existing
                ? existing
          """.replace('          ', ''),
              """    const sameAuthority = existing !== undefined
                && existing.baseURL === baseURL
                && existing.tenantId === tenantId
              const next: StoredObisIdentity = sameAuthority
                ? existing
          """.replace('          ', ''),
          )

          replace(
              'apps/desktop/src/desktop-enterprise-overview-main.ts',
              "  if (input.decision !== 'approve' && input.decision !== 'reject') throw new Error('Approval decision must be approve or reject')\n",
              '',
          )

          replace(
              'apps/desktop/src/desktop-obis-identity-ui.ts',
              'async function configurationGate(root: HTMLElement): Promise<void> {',
              'function configurationGate(root: HTMLElement): void {',
          )
          replace(
              'apps/desktop/src/desktop-obis-identity-ui.ts',
              '    if (status.required) await configurationGate(root)',
              '    if (status.required) configurationGate(root)',
          )
          replace(
              'apps/desktop/src/desktop-obis-identity-ui.ts',
              "          if (result.status === 'slow_down') waitSeconds = Math.max(waitSeconds + 5, result.retryAfterSeconds ?? 0)\n          else if (result.retryAfterSeconds !== undefined) waitSeconds = Math.max(waitSeconds, result.retryAfterSeconds)",
              "          if (result.status === 'slow_down') waitSeconds = Math.max(waitSeconds + 5, result.retryAfterSeconds ?? 0)",
          )

          replace(
              'apps/desktop/src/desktop-enterprise-overview-ui.ts',
              """function renderApprovals(host: HTMLElement, overview: DesktopEnterpriseOverview, refresh: () => Promise<void>): void {
            if (sectionUnavailable(host, overview.approvals, 'Approval inbox')) return
            const inbox = overview.approvals.value
          """.replace('          ', ''),
              """function renderApprovals(host: HTMLElement, overview: DesktopEnterpriseOverview, refresh: () => Promise<void>): void {
            if (!overview.approvals.available) {
              sectionUnavailable(host, overview.approvals, 'Approval inbox')
              return
            }
            const inbox = overview.approvals.value
          """.replace('          ', ''),
          )

          shell = Path('apps/desktop/src/desktop-enterprise-shell.ts')
          text = shell.read_text()
          text = text.replace(
              "name.oninput = () => { items = replace(items, index, { ...items[index]!, label: name.value }) }",
              """name.oninput = () => {
                const current = items[index]
                if (current) items = replace(items, index, { ...current, label: name.value })
              }""".replace('              ', ''),
              1,
          )
          text = text.replace(
              "items = replace(items, index, { ...items[index]!, requiredRoles: roles.length ? roles : undefined } as DesktopNavigationItem)",
              """const current = items[index]
                if (current) {
                  items = replace(items, index, {
                    ...current,
                    requiredRoles: roles.length ? roles : undefined,
                  } as DesktopNavigationItem)
                }""".replace('              ', ''),
              1,
          )
          text = text.replace(
              ".catch(error => {\n        console.error('[enterprise-scope] failed to switch runtime scope:', error)",
              ".catch((error: unknown) => {\n        console.error('[enterprise-scope] failed to switch runtime scope:', error)",
              1,
          )
          shell.write_text(text)

          launch = Path('packages/obis/launch/src/client/index.ts')
          text = launch.read_text()
          marker = "const SESSION_KEY = 'dsh.obisLaunch'\n"
          typed = """const SESSION_KEY = 'dsh.obisLaunch'

          interface ObisLaunchRpcResult {
            ok: boolean
            value?: unknown
            error?: { message?: string }
          }

          interface ObisLaunchConnection {
            rpc: {
              call(path: string, method: string, input: unknown): Promise<ObisLaunchRpcResult>
            }
          }
          """.replace('          ', '')
          if marker not in text:
              raise SystemExit('launch SESSION_KEY marker missing')
          text = text.replace(marker, typed, 1)
          old = """  void ctx.connection.rpc.call('/obis-launch', 'exchange', { ticket, harnessOrigin }).then((result) => {
            if (!result.ok) throw new Error(result.error.message)
            const exchange = result.value as SafeWorkspaceLaunchExchange
          """.replace('          ', '')
          new = """  const connection = ctx.connection as unknown as ObisLaunchConnection
            void connection.rpc.call('/obis-launch', 'exchange', { ticket, harnessOrigin }).then((result) => {
              if (!result.ok) throw new Error(result.error?.message ?? 'OBIS launch exchange failed')
              const exchange = result.value as SafeWorkspaceLaunchExchange
          """.replace('          ', '')
          if old not in text:
              raise SystemExit('launch rpc marker missing')
          launch.write_text(text.replace(old, new, 1))

          bridge = Path('packages/obis/bridge/src/client.ts')
          text = bridge.read_text()
          text = text.replace("    if (!this.fetchImpl) throw new TypeError('A Fetch implementation is required.')\n", '', 1)
          text = text.replace("String(payload.error.code ?? 'OHP_REQUEST_FAILED')", 'payload.error.code')
          bridge.write_text(text)
          PY
      - name: Commit semantic fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src packages/obis
          git commit -m 'fix(enterprise): resolve runtime authority type and lint issues'
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
