name: Enterprise Lint Finalize

on:
  push:
    branches: [feature/enterprise-v3.1-sprint-a]
    paths: [.github/workflows/enterprise-lint-finalize.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install exact workspace graph
        run: pnpm install --frozen-lockfile
      - name: Fix remaining semantic conditions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/desktop/src/desktop-obis-identity-ui.ts')
          text = p.read_text()
          text = text.replace(
              "      while (!cancelled && currentAuthorization === authorization && Date.now() < deadline) {",
              "      while (!cancelled && Date.now() < deadline) {",
              1,
          )
          text = text.replace(
              "        if (cancelled || currentAuthorization !== authorization) return",
              "        if (cancelled) return",
              1,
          )
          text = text.replace(
              "      if (!cancelled && currentAuthorization === authorization) {",
              "      if (!cancelled) {",
              1,
          )
          p.write_text(text)

          p = Path('apps/desktop/src/desktop-enterprise-overview-ui.ts')
          text = p.read_text().replace(
              "Object.values(snapshot.usage.startsThisMinute).reduce((sum, value) => sum + (value ?? 0), 0)",
              "Object.values(snapshot.usage.startsThisMinute).reduce((sum, value) => sum + value, 0)",
              1,
          )
          p.write_text(text)
          PY
      - name: Format touched enterprise sources
        run: >-
          pnpm dlx prettier@3.6.2 --write --no-semi --single-quote --print-width 120
          packages/obis/bridge/src/client.ts
          apps/desktop/src/desktop-enterprise-overview-ui.ts
          apps/desktop/src/desktop-obis-identity-main.ts
          apps/desktop/src/desktop-enterprise-overview-main.ts
          apps/desktop/src/desktop-enterprise-shell.ts
          apps/desktop/src/main.ts
          apps/desktop/src/desktop-obis-identity-ui.ts
      - name: Verify full lint gate
        run: pnpm run lint
      - name: Commit verified lint fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/obis/bridge/src/client.ts apps/desktop/src
          git diff --cached --check
          git commit -m 'style(enterprise): clear final validation lint blockers'
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
