name: OBIS lock sync

on:
  push:
    branches: ['feature/obis-harness-unified-p0']
    paths:
      - 'packages/obis/**/package.json'
      - '.github/workflows/obis-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate workspace lock importers
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(obis): sync workspace lockfile'
          git push origin HEAD:feature/obis-harness-unified-p0
