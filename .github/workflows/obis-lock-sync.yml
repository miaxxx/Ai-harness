name: OBIS Lock Sync

on:
  push:
    branches:
      - feature/obis-harness-unified-p0
    paths:
      - packages/obis/tool-obis/package.json
      - .github/workflows/obis-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/obis-harness-unified-p0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore(obis): sync workspace lockfile"
          git push origin HEAD:feature/obis-harness-unified-p0
