name: OBIS Compatibility

on:
  push:
    branches: ['feature/**']
    paths:
      - 'packages/obis/**'
      - '.github/workflows/obis-compatibility.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    paths:
      - 'packages/obis/**'
      - '.github/workflows/obis-compatibility.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obis:
    name: OHP bridge + native tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install workspace from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck OBIS integration packages
        run: pnpm exec tsc -b packages/obis/bridge packages/obis/tool-obis
      - name: Materialize package runtime entries
        run: |
          # The repository's normal tsdown workspace build uses fixedExtension=false
          # and publishes lib/*.js. For this narrow lane, TypeScript has already
          # emitted the same ESM modules under lib/types; copy the complete runtime
          # module sets to the declared package entry location rather than creating
          # a second bundler configuration.
          cp packages/obis/bridge/lib/types/*.js packages/obis/bridge/lib/
          cp packages/obis/tool-obis/lib/types/*.js packages/obis/tool-obis/lib/
      - name: Run OBIS integration contract tests
        run: pnpm exec vitest run packages/obis/bridge/tests packages/obis/tool-obis/tests
