name: Desktop build diagnostic

on:
  push:
    branches: [feature/enterprise-v3.1-sprint-a]
    paths:
      - .github/workflows/desktop-build-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enterprise-v3.1-sprint-a
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Capture Desktop build output
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm --dir apps/desktop run build > .ci/desktop-build-diagnostic.log 2>&1
          code=$?
          set -e
          printf '\nEXIT_CODE=%s\n' "$code" >> .ci/desktop-build-diagnostic.log
          cat .ci/desktop-build-diagnostic.log
      - name: Commit diagnostic log
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/desktop-build-diagnostic.log
          git commit -m 'ci: capture desktop build diagnostic' || exit 0
          git push origin HEAD:feature/enterprise-v3.1-sprint-a
